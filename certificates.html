<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب شهادة | مركز الأمجاد للغات والتدريب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50">

    <header class="h-48 flex items-center justify-center">
        <div class="header-logo-container">
            <a href="index.html">
                <img src="1.svg" alt="شعار مركز الأمجاد" class="logo-center w-48">
            </a>
        </div>
    </header>

    <main class="container -mt-10 relative z-10 pb-20">
        <div class="bg-white rounded-3xl shadow-xl p-8 max-w-3xl mx-auto animate-fade-up">
            <h1 class="text-3xl font-extrabold text-primary mb-2 text-center">طلب إصدار شهادة</h1>
            <p class="text-slate-500 text-center mb-8">يرجى تعبئة البيانات بدقة كما هي في البطاقة الشخصية</p>

            <form id="certificateForm" onsubmit="handleCertificateSubmit(event)" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="form-group">
                        <label for="fullNameAr">الاسم باللغة العربية *</label>
                        <input type="text" id="fullNameAr" class="form-control" placeholder="أدخل اسمك الرباعي" required>
                    </div>
                    <div class="form-group">
                        <label for="fullNameEn">الاسم باللغة الإنجليزية *</label>
                        <input type="text" id="fullNameEn" class="form-control" placeholder="Full Name in English" required>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="form-group">
                        <label for="phone">رقم الهاتف *</label>
                        <input type="tel" id="phone" class="form-control" placeholder="777 000 000" required>
                    </div>
                    <div class="form-group">
                        <label for="courseName">اسم الدورة التدريبية *</label>
                        <input type="text" id="courseName" class="form-control" placeholder="مثال: لغة إنجليزية - مستوى أول" required>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="form-group">
                        <label for="birthPlace">مكان الميلاد</label>
                        <input type="text" id="birthPlace" class="form-control" placeholder="المحافظة/المديرية">
                    </div>
                    <div class="form-group">
                        <label for="birthDate">تاريخ الميلاد</label>
                        <input type="date" id="birthDate" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="gender">الجنس</label>
                        <select id="gender" class="form-control">
                            <option value="ذكر">ذكر</option>
                            <option value="أنثى">أنثى</option>
                        </select>
                    </div>
                </div>

                <div class="bg-blue-50 p-6 rounded-2xl border border-blue-100 mb-6">
                    <p class="text-sm text-blue-800 leading-relaxed">
                        <strong>ملاحظة:</strong> بعد إرسال الطلب، سيقوم فريقنا بمراجعة البيانات والتواصل معك لاستكمال إجراءات استلام الشهادة. قد يتطلب الأمر دفع رسوم الإصدار المقررة.
                    </p>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary w-full py-4 text-lg">
                    إرسال طلب الشهادة
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-primary-dark text-white text-center py-8">
        <p>جميع الحقوق محفوظة &copy; 2026 | مركز الأمجاد للغات والتدريب</p>
    </footer>

    <script type="module">
        import { submitCertificateRequest } from './firebase-config.js';

        window.handleCertificateSubmit = async (event) => {
            event.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerText;

            const data = {
                fullNameAr: document.getElementById('fullNameAr').value,
                fullNameEn: document.getElementById('fullNameEn').value,
                phone: document.getElementById('phone').value,
                courseName: document.getElementById('courseName').value,
                birthPlace: document.getElementById('birthPlace').value,
                birthDate: document.getElementById('birthDate').value,
                gender: document.getElementById('gender').value
            };

            submitBtn.disabled = true;
            submitBtn.innerText = 'جاري المعالجة...';

            try {
                await submitCertificateRequest(data);
                
                const msg = `طلب شهادة جديد\nالاسم (عربي): ${data.fullNameAr}\nالاسم (إنجليزي): ${data.fullNameEn}\nالدورة: ${data.courseName}\nالهاتف: ${data.phone}`;
                window.open(`https://wa.me/967778005033?text=${encodeURIComponent(msg)}`, '_blank');
                
                alert('تم استلام طلبك بنجاح! سيتم التواصل معك قريباً.');
                event.target.reset();
            } catch (error) {
                alert('حدث خطأ. يرجى المحاولة مرة أخرى أو التواصل معنا مباشرة.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = originalText;
            }
        };
    </script>
</body>
</html>
