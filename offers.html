<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العروض والمنح | مركز الأمجاد للغات والتدريب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50">

    <header class="h-48 flex items-center justify-center">
        <div class="header-logo-container">
            <a href="index.html">
                <img src="1.svg" alt="شعار مركز الأمجاد" class="logo-center w-48">
            </a>
        </div>
    </header>

    <main class="container -mt-10 relative z-10 pb-20">
        <div class="text-center mb-12 animate-fade-up">
            <h1 class="text-4xl font-extrabold text-primary mb-4">أحدث العروض والمنح</h1>
            <p class="text-slate-600">استثمر في مستقبلك مع أفضل العروض التدريبية المتاحة حالياً</p>
        </div>

        <div id="offers-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- سيتم تحميل العروض ديناميكياً هنا -->
            <div id="loader" class="col-span-full text-center py-20">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-primary border-t-transparent"></div>
                <p class="mt-4 text-slate-500">جاري تحميل العروض الحالية...</p>
            </div>
        </div>

        <div class="mt-16 bg-primary rounded-3xl p-8 md:p-12 text-white text-center shadow-2xl animate-fade-up">
            <h2 class="text-3xl font-bold mb-4">هل لديك استفسار عن عرض معين؟</h2>
            <p class="mb-8 opacity-90 text-lg">فريقنا جاهز للرد على جميع تساؤلاتكم حول المنح المتاحة والخصومات الجارية.</p>
            <a href="https://wa.me/967778005033" class="bg-white text-primary px-10 py-4 rounded-full font-bold hover:bg-slate-100 transition-all transform hover:scale-105 inline-block shadow-lg">
                تواصل معنا عبر واتساب
            </a>
        </div>
    </main>

    <footer class="bg-primary-dark text-white text-center py-8">
        <p>جميع الحقوق محفوظة &copy; 2026 | مركز الأمجاد للغات والتدريب</p>
    </footer>

    <script>
        const offersContainer = document.getElementById('offers-container');
        const loader = document.getElementById('loader');
        let offerIndex = 1;
        let foundAny = false;

        function checkNextOffer() {
            const img = new Image();
            const currentIdx = offerIndex;
            img.src = `offers/${currentIdx}.svg`;

            img.onload = () => {
                foundAny = true;
                loader.style.display = 'none';
                
                const card = document.createElement('div');
                card.className = 'bg-white rounded-3xl shadow-lg overflow-hidden border border-slate-100 flex flex-col animate-fade-up';
                card.style.animationDelay = `${currentIdx * 0.1}s`;
                
                card.innerHTML = `
                    <div class="relative overflow-hidden group">
                        <img src="offers/${currentIdx}.svg" alt="Offer ${currentIdx}" class="w-full h-auto transition-transform duration-500 group-hover:scale-110">
                        <div class="absolute inset-0 bg-primary/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    </div>
                    <div class="p-6 flex-grow flex flex-col justify-between">
                        <div>
                            <h3 class="text-xl font-bold text-primary mb-3">عرض تدريبي رقم ${currentIdx}</h3>
                            <p class="text-slate-600 text-sm mb-6">اكتشف تفاصيل هذا العرض المميز وبادر بالتسجيل للاستفادة من الخصم المتاح.</p>
                        </div>
                        <button onclick="registerInterest(${currentIdx})" class="btn btn-primary w-full">سجل اهتمامك الآن</button>
                    </div>
                `;
                
                offersContainer.appendChild(card);
                offerIndex++;
                if (offerIndex <= 10) checkNextOffer(); // نفحص حتى 10 عروض كمثال
            };

            img.onerror = () => {
                if (offerIndex === 1) {
                    loader.innerHTML = '<p class="text-slate-500">لا توجد عروض متاحة حالياً. تابعنا لتصلك أحدث المنح.</p>';
                } else {
                    loader.style.display = 'none';
                }
            };
        }

        function registerInterest(id) {
            const msg = `مرحباً مركز الأمجاد، أود الاستفسار والتسجيل في العرض رقم: ${id}`;
            window.open(`https://wa.me/967778005033?text=${encodeURIComponent(msg)}`, '_blank');
        }

        window.onload = checkNextOffer;
    </script>
</body>
</html>
